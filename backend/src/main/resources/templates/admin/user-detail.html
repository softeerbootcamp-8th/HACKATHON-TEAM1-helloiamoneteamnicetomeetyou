<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{admin/layout :: page(${user.username} ?: '사용자', ~{::content})}"
>
  <body>
    <th:block th:fragment="content" th:remove="tag">
      <div class="page-head">
        <div>
          <h1 th:text="${user.username} ?: '이름 없는 사용자'">사용자</h1>
          <p>
            <span class="mono" th:text="${user.id}"></span>
            <span class="badge brand" th:if="${user.adminManaged}" style="margin-left: 6px">더미</span>
            <span class="badge" th:unless="${user.adminManaged}" style="margin-left: 6px">실제 참가자</span>
          </p>
        </div>
        <div class="btn-row">
          <a class="btn ghost" href="/admin/users">목록으로</a>
          <!--/*
            진짜 참가자는 지우는 버튼 자체를 두지 않는다. 서버에서도 막고 있지만, 부스에서
            손이 급할 때 누를 수 있는 자리에 있는 것 자체가 위험하다.
          */-->
          <form
            th:if="${user.adminManaged}"
            method="post"
            th:action="@{'/admin/users/' + ${user.id} + '/delete'}"
            th:data-confirm="'더미 ' + (${user.username} ?: '이름 없음') + ' 과(와) 그 사람이 들고 있던 카드를 지웁니다.'"
          >
            <button class="btn danger" type="submit">이 더미 지우기</button>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>표시 이름</h2>
        </div>
        <div class="card-body">
          <form method="post" th:action="@{'/admin/users/' + ${user.id} + '/rename'}" class="form-row">
            <div class="field grow-2">
              <label>이름</label>
              <input class="input" name="username" th:value="${user.username}" required />
            </div>
            <button class="btn" type="submit">고치기</button>
          </form>
        </div>
      </div>

      <div class="grid-2">
        <!--/* 보유 카드. 수량이 있어서 스테퍼가 붙는다. */-->
        <div class="card" style="margin-top: 0">
          <div class="card-head">
            <div>
              <h2>보유 카드</h2>
              <p class="sub">이 사람이 내놓을 수 있는 카드입니다.</p>
            </div>
            <span class="badge"><span th:text="${#lists.size(haveItems)}">0</span>종</span>
          </div>

          <div class="card-body tight">
            <form method="post" th:action="@{'/admin/users/' + ${user.id} + '/have'}" class="form-row">
              <div class="field grow-2">
                <label for="have-item">카드</label>
                <select class="input" id="have-item" name="itemId" required>
                  <option th:each="item : ${allItems}" th:value="${item.id}" th:text="${item.name}"></option>
                </select>
              </div>
              <div class="field" style="flex: 0 0 auto; min-width: 0">
                <label for="have-qty">수량</label>
                <input class="input narrow" id="have-qty" name="quantity" type="number" min="1" value="1" />
              </div>
              <button class="btn brand" type="submit">붙이기</button>
            </form>
          </div>

          <div class="rows" th:if="${!#lists.isEmpty(haveItems)}">
            <div class="row" th:each="have : ${haveItems}">
              <div class="chip-card">
                <img th:if="${have.item.imageUrl}" th:src="${have.item.imageUrl}" th:alt="${have.item.name}" />
                <span th:unless="${have.item.imageUrl}" th:text="${have.item.code}">N74</span>
              </div>

              <div class="grow">
                <div class="title" th:text="${have.item.name}">카드</div>
              </div>

              <!--/* 수량 스테퍼. 누르면 바로 저장된다. */-->
              <form
                method="post"
                th:action="@{'/admin/users/' + ${user.id} + '/have/' + ${have.id} + '/quantity'}"
                class="actions"
              >
                <button class="icon-btn" type="button" data-step="-1" aria-label="하나 줄이기">−</button>
                <input
                  class="input narrow"
                  name="quantity"
                  type="number"
                  min="1"
                  th:value="${have.quantity}"
                  style="height: 30px; border-radius: 999px"
                />
                <button class="icon-btn" type="button" data-step="1" aria-label="하나 늘리기">+</button>
              </form>

              <form method="post" th:action="@{'/admin/users/' + ${user.id} + '/have/' + ${have.id} + '/delete'}">
                <button class="icon-btn danger" type="submit" aria-label="떼기">×</button>
              </form>
            </div>
          </div>

          <div class="empty" th:if="${#lists.isEmpty(haveItems)}">
            <strong>내놓을 카드가 없습니다</strong>
            이 사람은 아직 매칭 상대가 될 수 없습니다.
          </div>
        </div>

        <!--/* 희망 카드. 수량 개념이 없다. */-->
        <div class="card" style="margin-top: 0">
          <div class="card-head">
            <div>
              <h2>희망 카드</h2>
              <p class="sub">이 사람이 찾는 카드입니다. 매칭 규칙이 실제로 보는 값입니다.</p>
            </div>
            <span class="badge"><span th:text="${#lists.size(wantItems)}">0</span>종</span>
          </div>

          <div class="card-body tight">
            <form method="post" th:action="@{'/admin/users/' + ${user.id} + '/want'}" class="form-row">
              <div class="field grow-2">
                <label for="want-item">카드</label>
                <select class="input" id="want-item" name="itemId" required>
                  <option th:each="item : ${allItems}" th:value="${item.id}" th:text="${item.name}"></option>
                </select>
              </div>
              <button class="btn brand" type="submit">붙이기</button>
            </form>
          </div>

          <div class="rows" th:if="${!#lists.isEmpty(wantItems)}">
            <div class="row" th:each="want : ${wantItems}">
              <div class="chip-card">
                <img th:if="${want.item.imageUrl}" th:src="${want.item.imageUrl}" th:alt="${want.item.name}" />
                <span th:unless="${want.item.imageUrl}" th:text="${want.item.code}">N74</span>
              </div>

              <div class="grow">
                <div class="title" th:text="${want.item.name}">카드</div>
              </div>

              <form method="post" th:action="@{'/admin/users/' + ${user.id} + '/want/' + ${want.id} + '/delete'}">
                <button class="icon-btn danger" type="submit" aria-label="떼기">×</button>
              </form>
            </div>
          </div>

          <div class="empty" th:if="${#lists.isEmpty(wantItems)}">
            <strong>찾는 카드가 없습니다</strong>
            찾는 카드가 없으면 이 사람에게는 매칭이 제안되지 않습니다.
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
