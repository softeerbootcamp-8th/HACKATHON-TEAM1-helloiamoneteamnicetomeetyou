# 로컬 E2E 테스트용 compose 파일.
# 사용법: docker compose up --build -d 로 띄우고 http://localhost:8080 으로 테스트 후 docker compose down.
#
# EC2 배포는 이 파일을 쓰지 않고 아래 Dockerfile 이미지를 직접 docker run 한다.
# 이후 DB/Redis 등 의존 서비스가 추가되면 여기 services 에 함께 추가하고
# app 의 depends_on / environment 에 연결 정보를 넣으면 된다.
services:
  app:
    build: .
    image: helloiamoneteamnicetomeetyou:local
    environment:
      SPRING_PROFILES_ACTIVE: e2e
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # 운영과 같은 화면으로 로그를 보고 싶을 때만 쓴다:
  #   docker compose --profile monitoring up -d   →  http://localhost:8081
  # profile 로 격리해서 기본 `docker compose up` 은 이 컨테이너를 띄우지 않는다.
  # 로컬은 `docker compose logs -f` 로도 충분하므로 인증은 걸지 않는다
  # (운영에서는 DOZZLE_AUTH_PROVIDER=simple 로 로그인을 요구한다 — deploy-backend.yml 참고).
  dozzle:
    image: amir20/dozzle:v10.7.4
    profiles: [monitoring]
    ports:
      - "8081:8080"
    environment:
      # 운영(deploy-backend.yml)은 name=^app$ 로 앵커링하지만 여기서는 앵커를 쓰지 않는다 —
      # compose 가 만드는 컨테이너 이름에는 프로젝트 접두사가 붙어서
      # (<project>-app-1) ^app$ 로는 아무것도 잡히지 않는다.
      DOZZLE_FILTER: name=app
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
