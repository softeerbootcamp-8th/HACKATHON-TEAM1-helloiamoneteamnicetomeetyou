<!doctype html>
<!--/*
  어드민 화면 공통 뼈대다. 각 화면은 th:replace 로 이 파일을 부르고 content 조각만 채운다.

  Thymeleaf 레이아웃 방언(thymeleaf-layout-dialect)을 쓰지 않았다. 의존성이 하나 더 늘고,
  화면이 대여섯 장뿐이라 기본 기능의 fragment 로 충분하다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2ced90" />
    <title th:text="'NearLy 어드민 · ' + ${title}">NearLy 어드민</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/admin-assets/admin.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="side">
        <div class="brandmark">
          <span class="dot"></span>
          <span>NearLy</span>
          <span class="tag">어드민</span>
        </div>

        <nav class="nav">
          <a href="/admin" th:classappend="${nav == 'dashboard'} ? 'on'">현황</a>
          <a href="/admin/users" th:classappend="${nav == 'users'} ? 'on'">사용자와 카드</a>
          <a href="/admin/booths" th:classappend="${nav == 'booths'} ? 'on'">부스와 카드 등록</a>
          <a href="/admin/exchanges" th:classappend="${nav == 'exchanges'} ? 'on'">교환 현황</a>
        </nav>

        <div class="side-foot">
          <!--/*
            로컬인지 배포인지 헷갈리지 않게 지금 붙어 있는 주소를 적어 둔다. 둘 다 같은 화면이라
            어느 쪽 데이터를 고치고 있는지 화면만 봐서는 알 수가 없다.

            Thymeleaf 3.1 부터 #httpServletRequest 가 없어져서 브라우저가 채우게 한다.
          */-->
          <div class="env">
            <b>지금 보고 있는 서버</b>
            <span data-origin>확인 중</span>
          </div>
          <a class="btn ghost sm" href="/admin/logout">로그아웃</a>
        </div>
      </aside>

      <main class="main">
        <th:block th:replace="${content}" />
      </main>
    </div>

    <!--/* 플래시 메시지. 리다이렉트로 넘어온 뒤 한 번만 뜨고 사라진다. */-->
    <div
      th:if="${toast}"
      class="toast"
      th:classappend="${toastTone == 'danger'} ? 'danger'"
      th:text="${toast}"
    ></div>

    <!--/* 되돌릴 수 없는 동작을 물어보는 자리. 화면 하나에 하나만 있으면 된다. */-->
    <dialog class="sheet" id="confirm-dialog">
      <div class="sheet-body">
        <h3>정말 진행할까요</h3>
        <p data-confirm-message></p>
      </div>
      <div class="sheet-actions">
        <button class="btn" type="button" data-confirm-cancel>그만두기</button>
        <button class="btn outline" type="button" data-confirm-ok>진행하기</button>
      </div>
    </dialog>

    <script src="/admin-assets/admin.js"></script>
  </body>
</html>
