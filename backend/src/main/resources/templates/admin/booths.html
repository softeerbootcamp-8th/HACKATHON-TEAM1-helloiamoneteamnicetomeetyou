<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: page('부스', ~{::content})}">
  <body>
    <th:block th:fragment="content" th:remove="tag">
      <div class="page-head">
        <div>
          <h1>부스와 카드 등록</h1>
          <p>부스를 열기 전에 채워 두는 값입니다. 부스를 고르면 구역과 카드를 손볼 수 있습니다.</p>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>부스 만들기</h2>
        </div>
        <div class="card-body">
          <form method="post" th:action="@{/admin/booths}" class="form-row">
            <div class="field">
              <label for="booth-name">이름</label>
              <input class="input" id="booth-name" name="name" placeholder="현대차 팝업 부스" required />
            </div>
            <div class="field grow-2">
              <label for="booth-desc">설명</label>
              <input class="input" id="booth-desc" name="description" placeholder="비워 둬도 됩니다" />
            </div>
            <button class="btn brand" type="submit">만들기</button>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>부스 목록</h2>
        </div>
        <div class="rows" th:if="${!#lists.isEmpty(booths)}">
          <div class="row linked" th:each="booth : ${booths}" th:data-href="'/admin/booths/' + ${booth.id}">
            <div class="grow">
              <div class="title" th:text="${booth.name}">부스</div>
              <div class="meta">
                <span th:text="${booth.description} ?: '설명 없음'"></span>
                · 구역 <span th:text="${booth.zoneCount}">0</span>개 · 카드
                <span th:text="${booth.itemCount}">0</span>종
              </div>
            </div>
            <span class="badge live" th:if="${booth.connectedCount > 0}">
              <span th:text="${booth.connectedCount}">0</span>명
            </span>
            <a class="btn outline sm" th:href="'/admin/booths/' + ${booth.id}">열기</a>
          </div>
        </div>
        <div class="empty" th:if="${#lists.isEmpty(booths)}">
          <strong>아직 부스가 없습니다</strong>
          위에서 첫 부스를 만드세요.
        </div>
      </div>
    </th:block>
  </body>
</html>
