# JPA 가 클래스패스에 있으면 DataSource 없이는 앱이 아예 뜨지 않는다.
# 그래서 기본/e2e/prod 세 프로파일 모두 datasource 를 갖는다.
#
# 기본 프로파일은 `./gradlew bootRun` 용이고, docker-compose.yml 의 mysql 이
# 호스트 3306 에 열려 있는 것을 그대로 본다 (`docker compose up -d mysql`).
#
# 로컬 URL 의 allowPublicKeyRetrieval=true 는 MySQL 8 의 기본 인증 플러그인
# (caching_sha2_password)이 SSL 을 끈 연결에서 서버 공개키를 요구하기 때문에 필요하다.
# 없으면 "Public Key Retrieval is not allowed" 로 부팅이 실패한다.
# prod 는 sslMode=REQUIRED 로 암호화된 연결을 쓰므로 이 옵션을 넣지 않는다.
spring:
  application:
    name: helloiamoneteamnicetomeetyou
  datasource:
    url: jdbc:mysql://localhost:3306/hackathon?sslMode=DISABLED&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:hackathon}
    password: ${DB_PASSWORD:hackathon}
  jpa:
    hibernate:
      # 해커톤 기간에는 마이그레이션 도구를 넣지 않는다. 스키마를 바꾸면 팀에 알린다.
      ddl-auto: update
    # Lazy 로딩을 Controller 까지 끌고 가지 않는다.
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8080

# 부스 실시간 알림(SSE) 설정이다.
#
# emitter-timeout-ms: 이 시간이 지나면 서버가 연결을 끊는다. 브라우저의 EventSource 가 곧바로
#   다시 붙고, 재연결되면 CONNECTED 를 다시 받아 화면이 현재 상태를 읽으므로 사용자는 모른다.
#   무한(0)으로 두지 않는 것은, 어떤 이유로든 정리되지 못한 연결이 영영 쌓이는 것을 막기 위해서다.
# heartbeat-interval-ms: 이 주기로 주석 줄을 보내 죽은 연결을 찾아낸다. 브라우저 기본 재연결
#   대기가 3초라 그보다 충분히 길게 두되, 중간 프록시가 조용한 연결을 끊기 전에는 오게 잡았다.
sse:
  emitter-timeout-ms: 1800000
  heartbeat-interval-ms: 15000

# 웹푸시(VAPID) 키다. `npx web-push generate-vapid-keys --json` 으로 만든 값을 그대로 쓴다.
# 값은 팀에서 따로 공유하고 저장소에 넣지 않는다. 배포는 GitHub Secrets 로 들어온다.
#
# 기본값을 주지 않는 것은 datasource 와 같은 이유다. 값이 빠지면 부팅 단계에서 바로 죽는 편이,
# 아무한테도 안 가는 알림을 조용히 성공으로 처리하는 것보다 낫다.
# 로컬에서 bootRun 하려면 셸이나 실행 구성에 VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY 를 넣는다.
#
# subject 는 APNs 가 https:// 나 mailto: 로 시작하지 않으면 403 을 준다.
push:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY}
    private-key: ${VAPID_PRIVATE_KEY}
    subject: ${VAPID_SUBJECT:https://52-78-131-174.sslip.io}

# 프론트가 다른 오리진에서 뜨기 때문에 허용할 오리진을 적어 둔다.
# YAML 목록으로 쓰면 @Value 가 못 읽어서 쉼표로 구분한 한 줄로 둔다.
# - https://*.vercel.app : 배포와 프리뷰. 프리뷰는 커밋마다 도메인이 바뀐다
# - http://localhost:5173 : Vite 개발 서버
# - http://localhost:4173 : Vite preview 서버. 서비스 워커가 dev 에서 돌지 않아서 PWA 와
#   푸시 확인은 preview 로만 할 수 있다. 브라우저는 same-origin 이어도 POST 에는 Origin 을
#   붙이기 때문에, 프록시를 거쳐도 이 오리진이 허용 목록에 없으면 403 이 된다.
cors:
  allowed-origin-patterns: https://*.vercel.app,http://localhost:5173,http://localhost:4173

---
# 로컬 docker compose E2E 테스트용 프로파일 (SPRING_PROFILES_ACTIVE=e2e)
# compose 네트워크 안에서는 서비스 이름 mysql 이 그대로 호스트명이 된다.
spring:
  config:
    activate:
      on-profile: e2e
  datasource:
    url: jdbc:mysql://mysql:3306/hackathon?sslMode=DISABLED&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: hackathon
    password: hackathon

---
# EC2 배포용 프로파일 (SPRING_PROFILES_ACTIVE=prod)
#
# RDS 접속 정보는 GitHub Secrets → deploy-backend.yml 의 docker run -e 로 들어온다.
# 기본값을 일부러 주지 않는다. 값이 빠지면 "Could not resolve placeholder 'DB_URL'" 로
# 부팅 단계에서 바로 죽는 편이, 조용히 엉뚱한 DB 를 보는 것보다 낫다.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        format_sql: false
