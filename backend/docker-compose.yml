# 로컬 E2E 테스트용 compose 파일.
# 사용법: docker compose up --build -d 로 띄우고 http://localhost:8080 으로 테스트 후 docker compose down.
# `./gradlew bootRun` 으로 개발할 때는 DB 만 띄우면 된다: docker compose up -d mysql
#
# EC2 배포는 이 파일을 쓰지 않고 아래 Dockerfile 이미지를 직접 docker run 한다.
# 배포 환경의 DB 는 RDS 이고 접속 정보는 GitHub Secrets 로 주입된다 (deploy-backend.yml 참고).
# compose 프로젝트 이름을 디렉터리명(backend)에 맡기지 않는다.
# backend/ 는 흔한 이름이라, 같은 머신의 다른 저장소와 프로젝트명이 겹치면
# compose 가 남의 컨테이너를 이 파일의 서비스로 착각해 recreate 해 버린다.
name: helloiamoneteamnicetomeetyou

services:
  mysql:
    # 배포 대상 RDS 가 MySQL 8.4.x 다. 로컬만 8.0 으로 두면 버전 차이가
    # 배포 시점에야 드러나므로 메이저 버전을 맞춘다.
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hackathon
      MYSQL_USER: hackathon
      MYSQL_PASSWORD: hackathon
    # 호스트에 열어 둬야 `./gradlew bootRun`(기본 프로파일)이 localhost:3306 으로 붙을 수 있다.
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # compose 가 $ 를 자기 변수로 먼저 먹으므로 $$ 로 이스케이프해서 컨테이너 안 변수를 쓴다.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  app:
    build: .
    image: helloiamoneteamnicetomeetyou:local
    environment:
      SPRING_PROFILES_ACTIVE: e2e
      # 배포(deploy-backend.yml)와 같은 타임존으로 맞춘다. 컨테이너 기본값은 UTC 다.
      JAVA_OPTS: -Duser.timezone=Asia/Seoul
    ports:
      - "8080:8080"
    # MySQL 이 뜨기 전에 붙으면 Hibernate 가 부팅에 실패한다. healthy 를 기다린다.
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      # DB 대기 + JPA 초기화가 붙어 기존 20s 로는 모자란다.
      start_period: 40s

volumes:
  mysql-data:
