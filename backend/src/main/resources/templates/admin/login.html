<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2cb3ed" />
    <title>NearLy 어드민 로그인</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/admin-assets/admin.css" />
  </head>
  <body>
    <div class="login">
      <div class="card">
        <div class="logo">
          <span class="dot" style="width: 11px; height: 11px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 4px var(--brand-ring)"></span>
          <span>NearLy</span>
          <span class="tag" style="margin-left: 2px; padding: 2px 7px; border-radius: 999px; background: var(--tile); color: var(--muted); font-size: 11px; font-weight: 700">어드민</span>
        </div>

        <h1>부스 운영 화면</h1>
        <p class="hint">
          매칭에 손을 대는 화면이라 로그인이 필요합니다.<br />
          한 번 들어오면 일주일 동안 풀리지 않습니다.
        </p>

        <form method="post" th:action="@{/admin/login}">
          <div class="field">
            <label for="username">아이디</label>
            <input class="input" id="username" name="username" autocomplete="username" autofocus required />
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input
              class="input"
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="btn brand wide" type="submit" style="margin-top: 6px">들어가기</button>
        </form>

        <div class="error" th:if="${error}" th:text="${error}"></div>
      </div>
    </div>

    <script src="/admin-assets/admin.js"></script>
  </body>
</html>
