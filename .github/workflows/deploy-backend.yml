name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    # 모노레포라 프론트엔드만 바뀐 push 로는 백엔드를 재배포하지 않는다.
    # 워크플로 파일 자체를 고쳤을 때는 돌아야 하므로 경로에 함께 넣는다.
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  # 실패한 배포를 커밋 없이 다시 돌리고 싶을 때 Actions 탭에서 수동 실행한다.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  # 배포 도중 취소되면 `docker rm -f app` 과 `docker run` 사이에서 멈춰
  # 컨테이너가 아예 없는 상태로 남을 수 있으므로 직렬화한다.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR은 이미지 이름에 대문자를 허용하지 않는다. 이 레포는 HACKATHON-TEAM1-... 이라
  # github.repository 를 그대로 쓰면 push 가 "repository name must be lowercase" 로 실패한다.
  # github.repository_owner(softeerbootcamp-8th)는 이미 소문자라 그대로 쓴다.
  IMAGE_NAME: hackathon-team1-helloiamoneteamnicetomeetyou

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # 모노레포 전환 이후 gradle 프로젝트는 backend/ 아래에 있다.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 이미지 빌드는 `bootJar -x test` 라 테스트를 건너뛴다.
      # 테스트는 여기서만 돌고, deploy 가 이 잡을 게이트로 삼는다.
      - run: ./gradlew --no-daemon test

      # 로컬 docker compose E2E 를 CI 에서도 돌리려면 이 자리에 추가한다:
      #   docker compose up --build -d && ./gradlew e2eTest ; docker compose down

  build:
    name: Build & push image
    # test 와 병렬로 돈다 — 이미지는 SHA 태그라 테스트가 깨져도 배포되지 않으므로
    # 여기서 기다리게 하지 않고 전체 소요시간을 줄인다. 게이트는 deploy 가 잡는다.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image ref
        id: image
        run: |
          echo "ref=${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU 셋업이 없는 건 의도적이다 — Dockerfile 런타임 스테이지에 RUN 이 없어서
      # arm64 명령을 실행할 일이 없다. 런타임 스테이지에 RUN 을 추가하면
      # docker/setup-qemu-action@v3 도 같이 넣어야 한다.
      - name: Build and push (arm64 for t4g)
        uses: docker/build-push-action@v7
        with:
          # Dockerfile 이 backend/ 안에 있고 COPY 경로도 그 기준이라 컨텍스트를 좁혀 준다.
          # 프론트엔드 소스가 빌드 컨텍스트로 전송되지 않아 빌드도 그만큼 가벼워진다.
          context: ./backend
          # t4g.micro = Graviton = arm64. amd64 이미지를 올리면 인스턴스에서 exec format error 가 난다.
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          # Gradle 의존성 레이어를 런 간에 재사용한다. 없으면 매번 전체 재다운로드.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GITHUB_TOKEN 으로 GHCR 에서 pull 하기 위해 필요하다.
      # 최상위 permissions 는 contents: read 뿐이라 여기서 따로 올려줘야 한다.
      packages: read
    steps:
      # 앱 배포보다 먼저 띄운다 — 앱이 기동에 실패해도 Dozzle 이 이미 떠 있어야 원인을 볼 수 있다.
      # continue-on-error: 모니터링 장애가 앱 배포를 막아서는 안 된다.
      - name: Ensure Dozzle (log viewer) is running
        uses: appleboy/ssh-action@v1
        continue-on-error: true
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 3m
          envs: DOZZLE_USERS_B64
          script: |
            set -euo pipefail

            # users.yml 을 base64 로 감싸 전달하는 이유:
            # 이 파일은 여러 줄이고 bcrypt 해시에 $ 가 들어간다($2a$11$...).
            # ssh-action 의 envs 로 여러 줄·$ 포함 값을 넘기면 셸 이스케이프가 깨질 수 있다.
            # base64 는 한 줄 영숫자라 그 문제가 원천적으로 없다.
            #
            # simple auth 는 /data/users.yml 파일이 반드시 있어야 한다 —
            # 아이디/비밀번호를 환경변수로 주는 방법은 Dozzle 에 없다.
            # 파일은 아래 명령으로 만든다(-it 를 붙이면 TTY 제어문자가 섞인다):
            #   docker run --rm amir20/dozzle:v10.7.4 generate admin \
            #     --password '<비밀번호>' --email <메일> --name '<이름>' | base64 | tr -d '\n'
            if [ -z "${DOZZLE_USERS_B64:-}" ]; then
              echo "DOZZLE_USERS_B64 미설정 — Dozzle 을 건너뜁니다."
              exit 0
            fi

            mkdir -p /home/ubuntu/dozzle
            umask 077
            printf '%s' "$DOZZLE_USERS_B64" | base64 -d > /home/ubuntu/dozzle/users.yml

            # Dozzle 은 상태를 갖지 않는다 — 로그는 Docker 의 json-file 에, 계정은 디스크에 있다.
            # 그래서 매 배포마다 재생성해도 안전하고, 오히려 재생성해야 이 파일의 설정 변경이 반영된다.
            docker rm -f dozzle 2>/dev/null || true

            # docker.sock 의 :ro 는 Docker API 를 제한하지 못한다(소켓이라 마운트 플래그가
            # API 시맨틱에 영향을 주지 않는다). 실질적 방어는 파괴적 기능을 켜지 않는 것이다 —
            # DOZZLE_ENABLE_ACTIONS(start/stop/restart)와 DOZZLE_ENABLE_SHELL(컨테이너 exec)은
            # 둘 다 기본값 off 이므로 명시적으로 켜지 않는다.
            #
            # 내부 포트는 8080 인데 앱과 겹치므로 호스트는 8081 로 매핑한다.
            # :latest 대신 버전을 고정한다 — 릴리스가 매우 잦아 배포마다 버전이 달라질 수 있다.
            #
            # 필터를 name=^app$ 로 앵커링한다. Docker 의 name 필터는 부분 문자열 매칭이라
            # name=app 이면 backend-app-2 같은 이름까지 걸린다(실측 확인). 앵커를 붙이면
            # 정확히 app 하나만 잡힌다. Dozzle 은 정지된 컨테이너도 목록에 넣으므로
            # 과거에 쓰던 이름이 남아 있으면 앵커 없이는 섞여 보인다.
            #
            # --memory 96m: 실측 유휴 37MiB 에 스트리밍·다중 접속 여유를 더한 값이다.
            # 상한은 예약이 아니라 한도다 — 실사용 합계(app 153 + dozzle 37 + OS 180 ≈ 370MiB)는
            # 906MiB 에 충분히 들어간다. 이 상한의 목적은 Dozzle 폭주가 앱을 죽이지 않게 하는 것.
            docker run -d \
              --name dozzle \
              --restart unless-stopped \
              -p 8081:8080 \
              --memory 96m \
              --log-opt max-size=5m --log-opt max-file=2 \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v /home/ubuntu/dozzle:/data \
              -e 'DOZZLE_FILTER=name=^app$' \
              -e DOZZLE_AUTH_PROVIDER=simple \
              amir20/dozzle:v10.7.4

            # continue-on-error 라 스텝이 초록이 되므로, 문제는 경고로 남겨 눈에 띄게 한다.
            #
            # curl --retry 를 쓰지 않는다. --retry 는 타임아웃과 5xx 같은 "전송상 오류"만
            # 재시도하고, 컨테이너가 아직 포트를 바인딩하지 않았을 때 나는
            # errno 56(connection reset by peer)은 재시도 대상이 아니다.
            # 실제로 컨테이너 시작 0.2초 뒤 단 한 번 찍고 실패해서, 정상 기동한 Dozzle 을
            # 죽은 것으로 오판했다. 앱 배포 스텝과 같은 명시적 루프로 바꾼다.
            #
            # /healthcheck 를 대상으로 삼는다 — 인증을 켜도 200 을 주는 전용 엔드포인트다
            # (/ 는 로그인으로 307, /api/* 는 401 이라 성공 판정이 애매하다).
            for i in $(seq 1 15); do
              if curl -fsS -o /dev/null http://localhost:8081/healthcheck 2>/dev/null; then
                echo "dozzle up on :8081 (${i} tries)"
                exit 0
              fi
              sleep 2
            done

            echo "::warning::Dozzle 응답 없음 — 아래 로그 확인"
            docker logs --tail 50 dozzle || true
        env:
          DOZZLE_USERS_B64: ${{ secrets.DOZZLE_USERS_B64 }}

      - name: Pull & restart container over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 배포가 걸려도 러너를 물고 있지 않게 자른다.
          command_timeout: 5m
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          # script_stop 은 이 액션의 입력이 아니다(Unexpected input 경고).
          # 스크립트 첫 줄의 set -euo pipefail 이 같은 역할을 한다.
          script: |
            set -euo pipefail

            # 패키지가 internal/private 이어도 GITHUB_TOKEN 으로 pull 할 수 있다.
            # 이 토큰은 잡 실행 중에만 유효하지만 pull 이 그 안에서 끝나므로 충분하고,
            # PAT 를 만들거나 패키지를 public 으로 열 필요가 없다.
            # (deploy 잡에 permissions.packages: read 가 있어야 동작한다.)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker pull "$IMAGE"

            # 만료된 자격증명을 인스턴스에 남기지 않는다.
            docker logout ghcr.io

            # 힙덤프·GC로그는 반드시 호스트에 남겨야 한다.
            # 컨테이너 안에 쓰면 다음 배포의 `docker rm -f` 때 함께 사라져 진단이 불가능해진다.
            # 이미지가 USER 1000:1000 으로 돌고 Ubuntu 의 ubuntu 계정이 uid 1000 이라
            # 이 디렉터리에 그대로 쓸 수 있다.
            mkdir -p /home/ubuntu/app/dumps

            # -XX:+UseG1GC 를 명시하는 이유:
            # JVM 은 "server class"(CPU 2개 이상 AND 메모리 1792MB 이상)에서만 G1 을 기본으로 쓴다.
            # --memory 640m 이면 이 문턱 아래라 JVM 이 SerialGC 를 골라버린다.
            # ADR-011 이 G1 으로 되돌린 결론이므로 컨테이너에서는 반드시 명시해야 한다.
            #
            # HeapDumpPath 는 %p(PID)를 그냥 쓴다 — systemd 의 Environment= 와 달리
            # Docker -e 에는 %p 를 유닛 이름으로 치환하는 보간이 없어 %%p 이스케이프가 불필요하다.
            #
            # MaxRAMPercentage=70 × 640m = 힙 448m.
            JVM_OPTS="-XX:MaxRAMPercentage=70.0 -XX:+UseG1GC"
            JVM_OPTS="$JVM_OPTS -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps/heapdump-%p.hprof"
            JVM_OPTS="$JVM_OPTS -Xlog:gc*,gc+heap=debug:file=/dumps/gc.log:time,uptime,level,tags:filecount=5,filesize=20m"

            docker rm -f app 2>/dev/null || true

            # --log-opt 이 없으면 json-file 이 무제한으로 쌓인다.
            # Dozzle 이 이 로그를 읽으므로 지금부터 로그에 의존하기 시작하는데,
            # 상한이 없으면 루트 볼륨이 찬다. 20m×5 = 100MB 로 GC로그 예산과 같게 맞췄다.
            docker run -d \
              --name app \
              --restart unless-stopped \
              -p 8080:8080 \
              --memory 640m \
              --log-opt max-size=20m --log-opt max-file=5 \
              -v /home/ubuntu/app/dumps:/dumps \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e JAVA_OPTS="$JVM_OPTS" \
              "$IMAGE"

            # 배포를 fire-and-forget 으로 두지 않는다. 안 뜨면 로그를 남기고 워크플로를 실패시킨다.
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
                echo "healthy after ${i} tries"
                # 롤백용으로 최근 이미지는 남기고 오래된 것만 정리한다 (루트 볼륨이 작다).
                docker image prune -af --filter "until=72h" || true
                exit 0
              fi
              sleep 2
            done

            echo "::error::health check failed"
            docker logs --tail 100 app
            exit 1
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Slack
    needs: [test, build, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Post result to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # secrets 컨텍스트는 job/step 의 if 에서 못 쓰므로 스크립트 안에서 확인한다.
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — 알림을 건너뜁니다."
            exit 0
          fi

          if [ "${{ needs.test.result }}" != "success" ]; then
            STATUS="배포 중단 (테스트: ${{ needs.test.result }})"; COLOR="#e01e5a"
          elif [ "${{ needs.build.result }}" != "success" ]; then
            STATUS="배포 중단 (이미지 빌드: ${{ needs.build.result }})"; COLOR="#e01e5a"
          elif [ "${{ needs.deploy.result }}" != "success" ]; then
            STATUS="배포 실패 (배포 단계)"; COLOR="#e01e5a"
          else
            STATUS="배포 성공"; COLOR="#2eb886"
          fi

          curl -sX POST -H 'Content-type: application/json' \
            --data "{\"attachments\":[{\"color\":\"${COLOR}\",\"title\":\"${STATUS}\",\"fields\":[{\"title\":\"브랜치\",\"value\":\"${{ github.ref_name }}\",\"short\":true},{\"title\":\"실행자\",\"value\":\"${{ github.actor }}\",\"short\":true}],\"actions\":[{\"type\":\"button\",\"text\":\"로그 보기\",\"url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}]}" \
            "$SLACK_WEBHOOK_URL"
