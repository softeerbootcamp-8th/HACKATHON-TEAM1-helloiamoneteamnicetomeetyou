plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.helloiamoneteamnicetomeetyou'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // 어드민 화면(/admin)을 서버에서 그려 내려보낸다.
    // 부스 운영자만 쓰는 화면이라 별도 프론트 배포 없이 백엔드 하나로 끝내려고 골랐다.
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Persistence — RDS(MySQL) 연결과 엔티티 매핑에 필요하다.
    // 버전은 io.spring.dependency-management 가 Boot BOM 으로 맞춰 준다.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Web Push(RFC 8291/8292) 발송. JDK 표준 암호화 API 와 java.net.http.HttpClient 만 쓰는
    // 23KB 라이브러리라 BouncyCastle/Netty 없이 붙는다. EC2 가 t4g.micro(힙 448MB, ARM)라
    // Netty 의 direct memory 와 x86_64 네이티브 전송을 끌고 오는 라이브러리는 쓰기 어렵다.
    implementation 'com.interaso:webpush:1.3.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// bootJar 산출물 이름을 고정한다.
// `./gradlew build` 는 bootJar 와 별개로 `jar` 태스크도 돌려서 -plain.jar 를 함께 만든다.
// 그러면 build/libs 에 jar 가 2개가 되고, Dockerfile 이 `*.jar` 글롭으로 COPY 하는 순간
// "여러 소스를 단일 파일 대상으로 복사"라서 빌드가 깨진다.
// 이름을 못박아 두면 Dockerfile 이 글롭 없이 app.jar 하나만 집어올 수 있다.
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}
